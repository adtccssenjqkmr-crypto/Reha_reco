workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Web Assets to Android Project
        script: |
          npx cap sync android
      - name: Build Android AAB
        script: |
          cd android
          chmod +x gradlew
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          cp ../signing.keystore app/signing.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/signing.keystore" \
            -Pandroid.injected.signing.store.password="GSqYFW8RNgPT" \
            -Pandroid.injected.signing.key.alias="my-key-alias" \
            -Pandroid.injected.signing.key.password="GSqYFW8RNgPT"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic-admin
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Web Assets to iOS Project
        script: |
          npx cap sync ios
      - name: Patch Development Team ID in Xcode project
        script: |
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 769Y9JYC3N;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Install CocoaPods (if Podfile exists)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "No Podfile found, using Swift Package Manager (CapApp-SPM)"
          fi
      - name: Install Provisioning Profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          cp ios/profile.mobileprovision "$PROFILES_HOME/"
      - name: Set up code signing settings on Xcode project
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' ios/App/App.xcodeproj/project.pbxproj || true
      - name: Build iOS App and Archive
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-flags="-allowProvisioningUpdates CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=769Y9JYC3N"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
